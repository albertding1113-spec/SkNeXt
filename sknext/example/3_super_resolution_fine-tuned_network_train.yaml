SYSTEM:
    DEVICE: "gpu"

PATHS:
    RESULT_DIR:
        PATH: '/HWFS/zhaohu_lab/dingjiayi/data/261020_SkNeXt_dataset/result'

TASK:
  CHANNELS: ["SR"]

SR:
  UPSAMPLE: 1                    # 1, 2, or 4; XY only, Z unchanged
  RESCALE_GT: True              # resize GT XY when shape is not (Z,Y*factor,X*factor)
  OUTPUT_CLIP: True             # clamp inference values to [0,1]

DATA:
  PATCH_SIZE: [16, 64, 64, 1]
  TRAIN:
    PATH: "/HWFS/zhaohu_lab/dingjiayi/data/261020_SkNeXt_dataset/dataset/super_resolution_train/raw"
    GT_PATH: "/HWFS/zhaohu_lab/dingjiayi/data/261020_SkNeXt_dataset/dataset/super_resolution_train/gt"
  VAL:
    PATH: "/HWFS/zhaohu_lab/dingjiayi/data/261020_SkNeXt_dataset/dataset/super_resolution_val/raw"
    GT_PATH: "/HWFS/zhaohu_lab/dingjiayi/data/261020_SkNeXt_dataset/dataset/super_resolution_val/gt"
  INFER:
    PATH: ""  # directory TIFF, TIFF file, OME-Zarr, or IMS
    GT_PATH: ''
    CHANNEL: [0]

AUGMENTOR:
  ENABLE: True
  HFLIP: True
  VFLIP: True
  ZFLIP: True
  RANDOM_ROT: True
  G_BLUR: True
  G_SIGMA: [0.0, 0.6]
  GAUSSIAN_NOISE: True
  NOISE_STD: [0.0, 0.02]
  AFFINE_MODE: "reflect"

MODEL:
    ARCHITECTURE: "unext_v2"
    LOAD_CHECKPOINT: False
    FEATURE_MAPS: [128, 256, 512, 1024, 1280]
    CONVNEXT_STEM_K_SIZE: 1
    Z_DOWN: [1, 1, 2, 2]
    YX_DOWN: [2, 2, 2, 2]
    ISOTROPY: [False, False, True, True, True]
    CONVNEXT_LAYERS: [2, 2, 2, 2, 2]

TRAIN:
    ENABLE: True
    RESUME: False
    AUTO_BATCH_SIZE: True
    REUSE_PATCH_STORES: False
    OPTIMIZER: "ADAMW"
    LR: 1.E-4
    EPOCHS: 10
    PATIENCE: 10
    LR_SCHEDULER:
        NAME: "warmupcosine"
        MIN_LR: 1.E-6
        WARMUP_COSINE_DECAY_EPOCHS: 3

INFER:
  ENABLE: false
